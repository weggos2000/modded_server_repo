## BlueMap core-config (Homestead School)
# Downloadt eenmalig de Minecraft-client-resources (textures) van Mojang; valt onder de Minecraft-EULA.
accept-download: true
data: "bluemap"
# 1 thread: de kaart rendert rustig op de achtergrond zonder de server of andere instances te vertragen.
render-thread-count: 1
# Ook blokken/textures van de mods in de pack renderen.
scan-for-mod-resources: true
metrics: false
log: {
  file: "bluemap/logs/debug.log"
  append: false
}
